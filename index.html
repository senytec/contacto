<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eric Suárez — Contacto</title>
<meta name="description" content="Tarjeta de contacto de Eric Suárez, especialista en impresión 3D y fabricación aditiva.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0e0b16;
    --card:#171226;
    --line:#2a2240;
    --text:#f2effa;
    --muted:#a79fc4;
    --violet:#8b5cf6;
    --violet-soft:#a78bfa;
    --radius:18px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:'Inter',system-ui,sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px 16px;
    background-image:
      repeating-linear-gradient(180deg, transparent 0px, transparent 11px, rgba(139,92,246,.045) 11px, rgba(139,92,246,.045) 12px);
  }
  .card{
    width:100%;
    max-width:400px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    overflow:hidden;
    box-shadow:0 24px 60px rgba(0,0,0,.45);
    animation:rise .5s ease both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.card{animation:none}}

  .header{
    padding:34px 28px 24px;
    position:relative;
    background:
      radial-gradient(120% 90% at 50% -20%, rgba(139,92,246,.28), transparent 60%);
    border-bottom:1px solid var(--line);
    text-align:center;
  }
  .avatar{
    width:84px;height:84px;
    margin:0 auto 16px;
    border-radius:50%;
    background:linear-gradient(135deg,var(--violet),#6d28d9);
    display:flex;align-items:center;justify-content:center;
    font-family:'Sora',sans-serif;
    font-weight:700;font-size:30px;color:#fff;
    letter-spacing:.5px;
    box-shadow:0 0 0 4px rgba(139,92,246,.18);
  }
  h1{
    font-family:'Sora',sans-serif;
    font-size:26px;font-weight:700;
    letter-spacing:-.3px;
  }
  .role{
    margin-top:6px;
    color:var(--violet-soft);
    font-size:14px;font-weight:500;
  }
  .tagline{
    margin-top:10px;
    color:var(--muted);
    font-size:13.5px;
    line-height:1.5;
  }

  .actions{padding:22px 22px 10px;display:grid;gap:11px}
  .btn{
    display:flex;align-items:center;gap:14px;
    padding:15px 18px;
    border-radius:13px;
    text-decoration:none;
    border:1px solid var(--line);
    color:var(--text);
    font-size:15px;font-weight:500;
    transition:transform .12s ease, border-color .12s ease, background .12s ease;
  }
  .btn:active{transform:scale(.98)}
  .btn:hover,.btn:focus-visible{border-color:var(--violet);background:rgba(139,92,246,.08)}
  .btn:focus-visible{outline:2px solid var(--violet);outline-offset:2px}
  .btn .ico{
    width:38px;height:38px;flex:none;
    border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    background:rgba(139,92,246,.14);
  }
  .btn .ico svg{width:19px;height:19px;stroke:var(--violet-soft);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .btn small{display:block;color:var(--muted);font-size:12.5px;font-weight:400;margin-top:2px}

  .btn-primary{
    background:linear-gradient(135deg,var(--violet),#6d28d9);
    border:none;
    justify-content:center;
    font-family:'Sora',sans-serif;
    font-weight:600;font-size:15.5px;color:#fff;
    padding:16px;
    box-shadow:0 8px 24px rgba(139,92,246,.35);
  }
  .btn-primary:hover,.btn-primary:focus-visible{background:linear-gradient(135deg,#9d71f8,#7c3aed)}
  .btn-primary .ico{background:rgba(255,255,255,.16)}
  .btn-primary .ico svg{stroke:#fff}

  .footer{
    padding:16px 22px 24px;
    text-align:center;
    color:var(--muted);
    font-size:12px;
    letter-spacing:.3px;
  }
</style>
</head>
<body>

<main class="card">
  <header class="header">
    <div class="avatar">ES</div>
    <h1>Eric Suárez</h1>
    <p class="role">Especialista en Impresión 3D</p>
    <p class="tagline">Fabricación aditiva y manufactura digital.<br>Madrid, España.</p>
  </header>

  <nav class="actions" aria-label="Opciones de contacto">
    <a class="btn btn-primary" href="contacto.vcf" download="Eric-Suarez.vcf">
      <span class="ico">
        <svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>
      </span>
      Guardar contacto
    </a>

    <a class="btn" href="tel:+34616621317">
      <span class="ico">
        <svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
      </span>
      <span>Llamar<small>+34 616 621 317</small></span>
    </a>

    <a class="btn" href="https://wa.me/34616621317" target="_blank" rel="noopener">
      <span class="ico">
        <svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
      </span>
      <span>WhatsApp<small>Mensaje directo</small></span>
    </a>

    <a class="btn" href="mailto:ericksm2002@gmail.com">
      <span class="ico">
        <svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
      </span>
      <span>Email<small>ericksm2002@gmail.com</small></span>
    </a>
  </nav>

  <footer class="footer">Impresión 3D · Fabricación aditiva · Madrid</footer>
</main>

</body>
</html>
